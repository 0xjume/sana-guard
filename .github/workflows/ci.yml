name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/guard
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libssl-dev

      - name: Install cargo-near
        run: cargo install cargo-near

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build WASM
        run: |
          cargo near build non-reproducible-wasm --no-abi
          WASM_FILE="../../target/near/sana_guard_contract/sana_guard_contract.wasm"
          WASM_SIZE=$(stat -c%s "$WASM_FILE")
          echo "WASM size: $((WASM_SIZE / 1024)) KB ($WASM_SIZE bytes)"
          ls -lh ../../target/near/sana_guard_contract/*.wasm

  # packages/sdk only. apps/* are placeholders; PR #5 (relay) may add more TS steps here.
  typescript:
    name: TypeScript (sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: SDK lint
        run: pnpm --filter @sana-guard/sdk lint

      - name: SDK typecheck
        run: pnpm --filter @sana-guard/sdk typecheck

      - name: SDK build
        run: pnpm --filter @sana-guard/sdk build

      - name: SDK test
        run: pnpm --filter @sana-guard/sdk test
