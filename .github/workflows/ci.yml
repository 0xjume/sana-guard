name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/guard
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libssl-dev

      - name: Install cargo-near
        run: cargo install cargo-near

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build WASM
        run: |
          cargo near build non-reproducible-wasm --no-abi
          WASM_FILE="../../target/near/sana_guard_contract/sana_guard_contract.wasm"
          WASM_SIZE=$(stat -c%s "$WASM_FILE")
          echo "WASM size: $((WASM_SIZE / 1024)) KB ($WASM_SIZE bytes)"
          ls -lh ../../target/near/sana_guard_contract/*.wasm

  typescript:
    name: TypeScript (sdk + mcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier (TS/JS/JSON, whole repo)
        run: pnpm format:check

      - name: SDK lint
        run: pnpm --filter @sana-guard/sdk lint

      - name: SDK typecheck
        run: pnpm --filter @sana-guard/sdk typecheck

      - name: SDK build
        run: pnpm --filter @sana-guard/sdk build

      - name: SDK test
        run: pnpm --filter @sana-guard/sdk test

      - name: MCP lint
        run: pnpm --filter @sana-guard/mcp lint

      - name: MCP typecheck
        run: pnpm --filter @sana-guard/mcp typecheck

      - name: MCP test
        run: pnpm --filter @sana-guard/mcp test

      - name: MCP build
        run: pnpm --filter @sana-guard/mcp build

  # Separate from the typescript job so SDK steps stay isolated.
  relay:
    name: Relay (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @sana-guard/relay lint

      - name: Type check
        run: pnpm --filter @sana-guard/relay typecheck

      - name: Test
        run: LOG_LEVEL=error pnpm --filter @sana-guard/relay test

  # Isolated from the typescript job (SDK) and from the relay unit job.
  relay-docker:
    name: Relay (docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build relay image
        run: docker build -f apps/relay/Dockerfile -t sana-guard-relay .

      - name: Run image and curl /v1/health
        run: |
          set -euo pipefail
          # Throwaway key, generated in this job. Never committed.
          KEY=$(docker run --rm --entrypoint node sana-guard-relay --input-type=module -e \
            "import { KeyPair } from 'near-api-js'; process.stdout.write(KeyPair.fromRandom('ed25519').toString());")
          docker run -d --name sana-relay-ci -p 127.0.0.1:3000:3000 \
            -e RELAY_ACCOUNT_ID=relay.ci.testnet \
            -e RELAY_NEAR_PRIVATE_KEY="$KEY" \
            -e DATABASE_URL=sqlite:/tmp/relay.db \
            -e LOG_LEVEL=error \
            -e NEAR_RPC_URL=http://127.0.0.1:9 \
            sana-guard-relay
          unset KEY
          trap 'docker logs sana-relay-ci || true; docker stop sana-relay-ci >/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/relay-health.json -w "%{http_code}" http://127.0.0.1:3000/v1/health || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "health HTTP $code"
              python3 - "$code" <<'PY'
          import json, sys
          code = sys.argv[1]
          body = json.load(open("/tmp/relay-health.json"))
          status = body.get("status")
          assert status in ("healthy", "degraded", "unhealthy"), body
          if status == "unhealthy":
              assert code == "503", code
              assert isinstance(body.get("error"), str) and body["error"], body
          else:
              assert code in ("200", "503"), code
              assert "relayBalanceNear" in body, body
              assert "relayBalanceFloor" in body, body
              assert body.get("network") in ("testnet", "mainnet"), body
              assert isinstance(body.get("guardContract"), str) and body["guardContract"], body
          print("health body ok:", body)
          PY
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = "1"
